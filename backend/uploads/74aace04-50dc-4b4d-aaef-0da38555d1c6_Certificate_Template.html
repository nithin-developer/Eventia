<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Participation Certificate</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@400;700&display=swap");

      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: "Roboto", sans-serif;
        background: #f3f2f7;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #certificate {
        width: 297mm; /* A4 landscape width */
        height: 210mm; /* A4 landscape height */
        background: white;
        border: 10px solid #00c951;
        padding: 50px;
        box-sizing: border-box;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      #certificate h1 {
        font-size: 40px;
        color: #000;
        margin-bottom: 15px;
      }

      #certificate p {
        font-size: 18px;
        margin: 8px 0;
        color: #000;
      }

      .editable {
        border-bottom: 1.5px dashed #00c951;
        display: inline-block;
        min-width: 200px;
        font-family: "Great Vibes", cursive;
        font-size: 26px;
        color: #000;
        padding: 3px;
        outline: none;
      }

      #footer {
        position: absolute;
        bottom: 120px; /* moved upward */
        width: 90%;
        display: flex;
        justify-content: space-between;
        padding: 0 40px;
        font-size: 16px;
        color: #000;
      }

      #footer div {
        text-align: center;
        min-width: 150px;
      }

      button {
        margin-top: 20px;
        padding: 12px 25px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        background-color: #00c951;
        color: #fff;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div>
      <div id="certificate">
        <h1>Certificate of Participation</h1>
        <p>This certificate is proudly presented to</p>
        <div contenteditable="true" class="editable" id="recipient">
          [Recipient Name]
        </div>
        <p>for actively participating in</p>
        <div contenteditable="true" class="editable" id="event-name">
          [Event Name]
        </div>
        <p>held on</p>
        <div contenteditable="true" class="editable" id="event-date">
          [Event Date]
        </div>

        <div id="footer">
          <div
            contenteditable="true"
            class="editable"
            style="border: none; font-size: 16px"
          >
            Organizer Signature
          </div>
          <div
            contenteditable="true"
            class="editable"
            style="border: none; font-size: 16px"
          >
            Seal
          </div>
        </div>
      </div>

      <button onclick="downloadCertificate()">Download Certificate</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
      async function downloadCertificate() {
        const { jsPDF } = window.jspdf;
        const certificate = document.getElementById("certificate");

        // Use html2canvas to render certificate
        const canvas = await html2canvas(certificate, {
          scale: 2,
          useCORS: true,
        });
        const imgData = canvas.toDataURL("image/png");

        // Create PDF
        const pdf = new jsPDF({
          orientation: "landscape",
          unit: "mm",
          format: "a4",
        });

        // Calculate image dimensions to maintain border
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();

        pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);
        pdf.save("certificate.pdf");
      }
    </script>
  </body>
</html>
